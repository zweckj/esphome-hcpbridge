# Variables to change the name of the entities
substitutions:
  name: "hcpbridge"
  friendly_name: "Garage Door"
  connection_state: "${name} Connected"
  relay_name: "${friendly_name} Relay state"
  light: "${friendly_name} Light"
  btn_vent: "${friendly_name} Vent" 
  btn_half: "${friendly_name} Half" 
  btn_impulse: "${friendly_name} Impulse" 
  sen_txt: "${friendly_name} State" 
  sw_vent: "${friendly_name} Venting" 
  sw_half: "${friendly_name} Open Half" 
  sen_pos: "${friendly_name} Position" 

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  platformio_options:
    board_build.f_cpu: 240000000L

external_components:
  - source:
      type: local
      path: "../components/"
  - source: github://epiclabs-uc/esphome-modbus-server
    refresh: 60s
    components: [modbus_server]

esp32:
  board: adafruit_feather_esp32s3 #set your board
  framework:
    type: arduino

# UART configuration for Modbus RTU communication
uart:
  - id: uart_modbus
    tx_pin: 17  # default TX pin
    rx_pin: 18  # default RX pin
    baud_rate: 57600
    stop_bits: 1
    data_bits: 8
    parity: EVEN

# Modbus Server configuration - ESP32 acts as Modbus slave
modbus_server:
  - id: modbus_hcp
    uart_id: uart_modbus
    address: 2  # Modbus slave address
    
    # Register configuration for Hörmann garage door controller
    holding_registers:
      # Command registers (0x9C41 to 0x9C43) - for sending commands to door
      - start_address: 0x9C41
        number: 3
        on_write: |-
          auto engine = &HoermannGarageEngine::getInstance();
          if (address == 0x9C41) {
            engine->onCounterWrite(value);
          }
          engine->setRegister9C41(address - 0x9C41, value);
          return value;
        on_read: |-
          auto engine = &HoermannGarageEngine::getInstance();
          return engine->getRegister9C41(address - 0x9C41);
      
      # Internal State registers (0x9CB9 to 0x9CC0) - for reading door state
      - start_address: 0x9CB9
        number: 8
        on_read: |-
          auto engine = &HoermannGarageEngine::getInstance();
          if (address == 0x9CB9) {
            engine->onModbusRequest();
          }
          return engine->getRegister9CB9(address - 0x9CB9);
        on_write: |-
          auto engine = &HoermannGarageEngine::getInstance();
          engine->setRegister9CB9(address - 0x9CB9, value);
          return value;
      
      # Broadcast registers (0x9D31 to 0x9D39) - for receiving door status updates
      - start_address: 0x9D31
        number: 9
        on_write: |-
          auto engine = &HoermannGarageEngine::getInstance();
          uint16_t offset = address - 0x9D31;
          if (offset == 1) {
            value = engine->onDoorPositionChanged(value);
          } else if (offset == 2) {
            value = engine->onCurrentStateChanged(value);
          } else if (offset == 6) {
            value = engine->onRegSevenChanged(value);
          }
          engine->setRegister9D31(offset, value);
          return value;
        on_read: |-
          auto engine = &HoermannGarageEngine::getInstance();
          return engine->getRegister9D31(address - 0x9D31);

hcpbridge:
  id: hcpbridge_id

cover:
  - platform: hcpbridge
    name: ${friendly_name}
    device_class: garage
    id: garagedoor_cover

binary_sensor:
  - platform: hcpbridge
    is_connected:
      name: "${connection_state}"
      id: sensor_connected
    relay_state:
      name: "${relay_name}"
      id: sensor_relay
      #on_state:
      #create your automation based on Garage Door Relay state

output:
  - platform: hcpbridge
    id: output_light

light:
  - platform: hcpbridge
    id: gd_light
    output: output_light
    name: ${light}

button:
  - platform: hcpbridge
    vent_button:
      id: button_vent
      name: "${btn_vent}"
    impulse_button:
      id: button_impulse
      name: "${btn_impulse}"
    half_button:
      id: button_half
      name: "${btn_half}"

text_sensor:
  - platform: hcpbridge
    id: sensor_templ_state
    name: "${sen_txt}"
#    filters:
#      - substitute:
#        - "Opening -> your text"
#        - "Move venting -> your text"
#        - "Move half -> your text"
#        - "Closing -> your text"
#        - "Open -> your text"
#        - "Closed -> your text"
#        - "Stopped -> your text"
#        - "Half open -> your text"
#        - "Venting -> your text"
#        - "Unknown -> your text"

switch:
  - platform: hcpbridge
    vent_switch:
      id: switch_vent
      name: "${sw_vent}"
      restore_mode: disabled
    half_switch:
      id: half_switch
      name: "${sw_half}"
      restore_mode: disabled

sensor:
  - platform: hcpbridge
    id: sensor_position
    name: ${sen_pos}

api:
  services:
    - service: go_to_open
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_open();
    - service: go_to_close
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_close();
    - service: go_to_half
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_half();
    - service: go_to_vent
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_vent();
    - service: toggle
      then:
        - cover.toggle: garagedoor_cover

wifi:
  ssid: "My Network"
  password: "My Password"

# Enable logging
logger:
  level: WARN

# Example configuration entry
ota:
  - platform: esphome
